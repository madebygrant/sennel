<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Source for every icon file here: regenerate with `tauri icon` from a 1024px render of this. -->
  <!-- The tile is 824px on the 1024px canvas, macOS's app icon grid, so it sits level with other apps. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e1e"/>
      <stop offset="1" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c07e"/>
      <stop offset="1" stop-color="#e2a65a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".58" r=".5">
      <stop offset="0" stop-color="#e2a65a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#e2a65a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="228"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000" opacity=".35" filter="url(#shadow)"/>
  <g transform="translate(100 100) scale(0.8046875)">
    <g clip-path="url(#tile)">
      <rect width="1024" height="1024" fill="url(#bg)"/>
      <polygon points="512,232 754.5,372 754.5,652 512,792 269.5,652 269.5,372" fill="#151515"/>
      <ellipse cx="512" cy="560" rx="200" ry="230" fill="url(#glow)"/>
      <polygon points="512,232 754.5,372 754.5,652 512,792 269.5,652 269.5,372" fill="none" stroke="url(#amber)" stroke-width="30" stroke-linejoin="round"/>
      <g transform="translate(512 512)" fill="url(#amber)">
        <circle cy="-44" r="62"/>
        <path d="M-30 -12 H30 L54 140 H-54 Z"/>
      </g>
    </g>
    <rect x="2" y="2" width="1020" height="1020" rx="226" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="4"/>
  </g>
</svg>
