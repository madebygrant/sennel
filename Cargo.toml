[package]
name = "sennel-tui"
version = "0.1.0"
edition = "2024"
description = "KeePass-style terminal password manager with one-key clipboard copy, folders and fuzzy search"
license = "MIT OR Apache-2.0"

# The binary users type is `sennel`; the crate keeps its -tui suffix.
[[bin]]
name = "sennel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Completions and the man page are printed by the binary from the same clap
# definition it parses with, so they cannot drift from the flags that exist.
# Both are thin layers over clap itself rather than new machinery.
clap_complete = "4"
clap_mangen = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "1"
unicode-normalization = "0.1"
unicode-width = "0.2"
# keepass (not keepass-rs): keepass-rs 0.2 cannot decrypt KeePassXC files
# (CBC length / header HMAC errors on correct passwords); the keepass crate
# opens them and is maintained. save_kdbx4 is what lets us write vaults back.
# totp: KeePassXC writes `otp` on entries, and an entry whose code Sennel
# cannot show is an entry the user has to open another app for.
keepass = { version = "0.13", features = ["save_kdbx4", "totp"] }
# Already in the tree under keepass, named here for the one thing the vault
# cannot do: KDBX stamps are UTC, and a timestamp is read in local time.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rpassword = "7"
arboard = "3"
nucleo-matcher = "0.3"
zeroize = "1"
secrecy = "0.8"
getrandom = "0.2"
# Two calls only: no core dumps, and no ptrace by the rest of this user's
# software — a dump of this process holds every secret at once.
libc = "0.2"

[profile.release]
strip = true
