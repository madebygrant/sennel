[workspace]
members = [".", "crates/sennel-core", "crates/sennel-desktop"]
# Third-party source patched in place: built as a dependency, never linted or tested as ours.
exclude = ["vendor"]
resolver = "3"

[patch.crates-io]
# keepass 0.14.0 with two attachment fixes. vendor/keepass/SENNEL-PATCHES.md says what and why, and
# what a version bump has to carry over or drop.
keepass = { path = "vendor/keepass" }

# Shared by both crates, so the pins and features are written once.
[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
# keepass (not keepass-rs): keepass-rs 0.2 cannot decrypt KeePassXC files
# (CBC length / header HMAC errors on correct passwords); the keepass crate
# opens them and is maintained. save_kdbx4 is what lets us write vaults back.
# totp: KeePassXC writes `otp` on entries, and an entry whose code Sennel
# cannot show is an entry the user has to open another app for.
# _merge: the crate's own merge, matched by uuid and modification time. The
# underscore marks it unstable, so the version is pinned and any bump has to
# rerun the merge tests in vault.rs before it lands.
# challenge_response: a YubiKey (or OnlyKey) HMAC-SHA1 slot as part of the key,
# which is how KeePassXC vaults protected by a hardware key are opened. It pulls
# in the `challenge_response` crate over `nusb`, pure Rust with no libusb.
# Built from vendor/keepass through [patch.crates-io] below, which fixes how it writes attachments.
keepass = { version = "=0.14.0", features = ["save_kdbx4", "totp", "_merge", "challenge_response"] }
# Already in the tree under keepass, named here for the one thing the vault
# cannot do: KDBX stamps are UTC, and a timestamp is read in local time.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# wayland-data-control: without it arboard only speaks X11, so on a Wayland
# session (no X11 clipboard manager) a copy reports success yet nothing
# reaches native Wayland paste targets. With it, copies go over
# zwlr_data_control and stay servable while Sennel runs; X11 sessions fall
# back to the X11 backend as before.
arboard = { version = "3", features = ["wayland-data-control"] }
zeroize = "1"

[package]
name = "sennel-tui"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "KeePass-style terminal password manager with one-key clipboard copy, folders and fuzzy search"
license = "MIT OR Apache-2.0"

# The binary users type is `sennel`; the crate keeps its -tui suffix.
[[bin]]
name = "sennel"
path = "src/main.rs"

[dependencies]
sennel-core = { path = "crates/sennel-core", features = ["clap"] }
anyhow.workspace = true
clap.workspace = true
# Completions and the man page are printed by the binary from the same clap
# definition it parses with, so they cannot drift from the flags that exist.
# Both are thin layers over clap itself rather than new machinery.
clap_complete = "4"
clap_mangen = "0.3"
ratatui = "0.30"
unicode-width = "0.2"
keepass.workspace = true
chrono.workspace = true
arboard.workspace = true
zeroize.workspace = true
rpassword = "7"
# Already in the tree under crossterm. A closed terminal or a `kill` must still wipe the clipboard
# and take keys back from the agent, which only a handler can do.
signal-hook = "0.3"

[dev-dependencies]
sennel-core = { path = "crates/sennel-core", features = ["clap", "test-support"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Every save and open runs Argon2 at 64 MiB, which takes seconds unoptimised and would make each
# debug run and test that touches a vault file wait on it.
[profile.dev.package.rust-argon2]
opt-level = 3

[profile.dev.package.blake2b_simd]
opt-level = 3

[profile.release]
strip = true
